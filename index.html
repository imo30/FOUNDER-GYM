<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuisioner AHP — Investasi Gym Publik ISHAP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #FFFFFF;
    --navy-2: #1A1A1A;
    --teal: #FFFFFF;
    --teal-dark: #CFCFCF;
    --amber: #CFCFCF;
    --paper: #000000;
    --card: #0E0E0E;
    --ink: #F2F2F2;
    --muted: #9A9A9A;
    --line: #2B2B2B;
    --danger: #E05252;
    --ok: #E8E8E8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--paper);
    background-image:
      radial-gradient(circle at 100% 0%, rgba(255,255,255,0.05), transparent 45%),
      radial-gradient(circle at 0% 100%, rgba(255,255,255,0.04), transparent 40%);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    display:flex;
    justify-content:center;
    padding: 32px 16px 60px;
  }
  h1,h2,h3, .display{ font-family:'Public Sans', system-ui, sans-serif; }
  #app{ width:100%; max-width: 720px; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 22px;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
  }
  .brand .mark{
    height:34px; width:auto;
    display:flex;align-items:center;justify-content:center;
  }
  .brand .mark img{ height:100%; width:auto; display:block; filter: drop-shadow(0 0 6px rgba(255,255,255,0.22)); }
  .brand .name{ font-size:13px; color: var(--muted); line-height:1.3; }
  .brand .name b{ color:var(--ink); display:block; font-size:14px;}

  .steps{
    display:flex; gap:6px;
  }
  .steps .seg{
    width: 30px; height:5px; border-radius:3px; background: var(--line);
    transition: background .25s ease;
  }
  .steps .seg.active{ background: var(--teal); }
  .steps .seg.done{ background: var(--navy); }

  .card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 32px 30px;
    box-shadow: 0 1px 2px rgba(16,38,61,0.04);
    position: relative;
    overflow: hidden;
    animation: cardIn .45s cubic-bezier(.16,1,.3,1);
  }
  .card::before{
    content:""; position:absolute; top:0; left:-40%; width:40%; height:2px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.85), transparent);
    animation: sweep 2.6s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes sweep{
    0%{ left:-40%; }
    100%{ left:100%; }
  }
  @keyframes cardIn{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image: repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 14px);
  }
  #app{ position:relative; z-index:1; }

  .eyebrow{
    font-size: 12.5px; color: var(--teal-dark); font-weight:600;
    margin-bottom: 8px;
  }
  h1.title{ font-size: 26px; line-height:1.25; margin: 0 0 6px; color: var(--navy); font-weight:800;}
  p.lede{ color: var(--muted); font-size: 15px; line-height:1.6; margin: 0 0 24px;}

  label.field-label{ display:block; font-size:13.5px; font-weight:600; margin: 18px 0 6px; color: var(--ink);}
  input[type=text], select{
    width:100%; padding: 11px 13px; border-radius:9px; border:1px solid var(--line);
    font-family:'Inter'; font-size:15px; background:#151515; color: var(--ink);
  }
  input[type=text]:focus, select:focus{ outline:2px solid var(--teal); outline-offset:1px; border-color: var(--teal);}

  .option-block{
    border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-top:14px;
    background: #141414;
  }
  .option-block .tag{
    display:inline-block; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:20px;
    margin-bottom:8px;
  }
  .tag.a{ background: rgba(255,255,255,0.12); color: var(--ink); }
  .tag.b{ background: rgba(255,255,255,0.06); color: var(--muted); border:1px solid var(--line); }
  .option-block h3{ margin: 0 0 6px; font-size:16px; color: var(--navy);}
  .option-block p{ margin:0; font-size:13.8px; color: var(--muted); line-height:1.55;}
  .option-block ul{ margin: 8px 0 0; padding-left:18px; font-size:13.5px; color: var(--ink); line-height:1.65;}

  .btn-row{ display:flex; gap:10px; margin-top: 26px; }
  button{
    font-family:'Inter'; font-weight:600; font-size:14.5px; cursor:pointer;
    border-radius:9px; border:none; padding: 12px 20px;
    transition: transform .08s ease, opacity .15s ease;
  }
  button:active{ transform: scale(0.98); }
  button.primary{ background: var(--teal); color:#000; transition: box-shadow .2s ease, transform .15s ease, background .2s ease; }
  button.primary:not(:disabled):hover{ box-shadow: 0 6px 20px rgba(255,255,255,0.22); transform: translateY(-1px); }
  button.primary:hover{ background: var(--teal-dark); }
  button.primary:disabled{ background:#3A3A3A; color:#8A8A8A; cursor:not-allowed; }
  button.ghost{ background:transparent; color: var(--navy); border: 1px solid var(--line); }
  button.ghost:hover{ background: #1C1C1C; }
  button.link{ background:none; color: var(--teal-dark); padding: 8px 0; text-decoration:underline; }

  /* pairwise comparison screen */
  .qmeta{ font-size:12.5px; color:var(--muted); margin-bottom: 4px; }
  .qtitle{ font-size:14px; color:var(--navy); font-weight:600; margin-bottom:22px;}

  .versus{
    display:grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items:start; margin-bottom: 8px;
  }
  .versus .side{ text-align:center; }
  .versus .side.left{ text-align:right; }
  .versus .side.right{ text-align:left; }
  .versus .vs{ font-family:'Public Sans'; font-weight:800; color: var(--line); font-size:13px; padding-top: 6px; }
  .side .num{ font-size:11px; color:var(--muted); font-weight:700; }
  .side .label{ font-size:15px; font-weight:700; color: var(--navy); line-height:1.3; margin-top:2px;}
  .side .desc{ font-size:12.5px; color: var(--muted); margin-top:6px; line-height:1.5; }

  .scale{
    margin-top: 26px;
  }
  .scale-track{
    display:flex; justify-content:space-between; gap:6px;
  }
  .scale-btn{
    flex:1; aspect-ratio:1; border-radius:10px; border:1px solid var(--line);
    background:#141414; font-family:'Public Sans'; font-weight:700; font-size:12.5px; letter-spacing:-0.3px; color: var(--ink);
    display:flex; align-items:center; justify-content:center; padding:0;
    transition: all .12s ease;
  }
  .scale-btn:hover{ border-color: var(--teal); }
  .scale-btn.selected{
    background: var(--teal); border-color: var(--teal); color:#000;
    box-shadow: 0 3px 10px rgba(255,255,255,0.18);
    animation: selectPop .3s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes selectPop{
    0%{ transform: scale(0.82); }
    60%{ transform: scale(1.1); }
    100%{ transform: scale(1); }
  }
  .scale-btn.selected.center{ background: var(--teal); border-color:var(--teal); color:#000; box-shadow: 0 3px 10px rgba(255,255,255,0.18);}
  .scale-caption{
    margin-top: 14px; text-align:center; font-size: 13.5px; min-height: 20px; color: var(--navy); font-weight:600;
  }
  .scale-hints{
    display:flex; justify-content:space-between; margin-top:6px; font-size:11px; color: var(--muted);
  }

  .footnote{ font-size:12px; color:var(--muted); margin-top:22px; line-height:1.5; border-top:1px dashed var(--line); padding-top:14px;}

  .accordion{ margin-top:24px; border-top:1px solid var(--line); }
  .acc-item{ border-bottom:1px solid var(--line); }
  .acc-head{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:15px 2px; cursor:pointer; font-weight:600; font-size:14.5px; color:var(--ink);
    user-select:none;
  }
  .acc-head:hover{ color:#fff; }
  .acc-head .chevron{ transition: transform .25s ease; color:var(--muted); font-size:12px; flex-shrink:0; }
  .acc-item.open .acc-head .chevron{ transform: rotate(180deg); }
  .acc-body{ max-height:0; overflow:hidden; transition: max-height .35s ease; }
  .acc-item.open .acc-body{ max-height: 420px; }
  .acc-body-inner{ padding: 0 2px 16px; font-size:13.5px; color:var(--muted); line-height:1.65; }
  .acc-placeholder-note{ display:block; margin-top:8px; font-size:11px; color:#7A7A7A; font-style:italic; }

  /* results */
  table.results{ width:100%; border-collapse: collapse; margin-top:18px; font-size:13.5px;}
  table.results th, table.results td{ text-align:left; padding:9px 8px; border-bottom:1px solid var(--line); }
  table.results th{ color:var(--muted); font-weight:600; font-size:12px; text-transform:none;}
  table.results td.num{ text-align:right; font-variant-numeric: tabular-nums; }
  .final-score{
    display:flex; gap:14px; margin-top:20px;
  }
  .score-card{
    flex:1; border-radius:12px; padding:16px 18px; border:1px solid var(--line);
  }
  .score-card.win{ background: rgba(255,255,255,0.06); border-color: var(--ink);}
  .score-card .who{ font-size:12px; font-weight:700; color: var(--muted);}
  .score-card .val{ font-family:'Public Sans'; font-weight:800; font-size:28px; color:var(--navy); margin-top:2px;}
  .score-card.win .val{ color: var(--teal-dark); }
  .pill{ display:inline-block; margin-top:6px; font-size:11px; background:var(--ink); color:#000; padding:2px 9px; border-radius:20px; font-weight:700;}

  .cr-box{
    margin-top:18px; padding:14px 16px; border-radius:10px; font-size:13.5px; line-height:1.5;
  }
  .cr-ok{ background: rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.25); color: var(--ink);}
  .cr-bad{ background: rgba(224,82,82,0.10); border:1px solid rgba(224,82,82,0.35); color: var(--danger);}

  .thanks-hero{ text-align:center; padding: 10px 0 6px;}
  .thanks-hero .checkmark{
    width:58px; height:58px; border-radius:50%; border:2px solid var(--ink);
    display:flex; align-items:center; justify-content:center; margin:0 auto 16px;
    animation: checkPop .5s cubic-bezier(.34,1.56,.64,1);
  }
  .thanks-hero .checkmark svg{ width:26px; height:26px; }
  .thanks-hero .checkmark path{
    stroke: var(--ink); stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray: 24; stroke-dashoffset:24;
    animation: checkDraw .4s ease .25s forwards;
  }
  @keyframes checkPop{
    0%{ transform: scale(0); opacity:0; }
    60%{ transform: scale(1.12); opacity:1; }
    100%{ transform: scale(1); }
  }
  @keyframes checkDraw{ to{ stroke-dashoffset:0; } }
  .thanks-hero .big{ font-family:'Public Sans'; font-weight:800; font-size:22px; color:var(--navy);}

  @media (max-width: 480px){
    .card{ padding: 24px 18px; }
    .versus{ grid-template-columns: 1fr; text-align:center; }
    .versus .side.left, .versus .side.right{ text-align:center; }
    .versus .vs{ padding: 4px 0; }
    .scale-track{ flex-wrap: wrap; }
    .scale-btn{ flex: 1 1 18%; }
    .final-score{ flex-direction: column; }
  }
</style>
</head>

const state = {
  step: "intro", // intro -> criteria -> options -> done
  profile: { name:"", role:"" },

/* ---------------------------------------------------------
   AHP MATH
--------------------------------------------------------- */
const RI_TABLE = {1:0,2:0,3:0.58,4:0.90,5:1.12,6:1.24,7:1.32,8:1.41,9:1.45,10:1.49};

function buildCriteriaMatrix(){
  const n = CRITERIA.length;
  const m = Array.from({length:n}, ()=> new Array(n).fill(1));
  CRIT_PAIRS.forEach(([a,b], idx)=>{
    const si = state.critAnswers[idx];
    const val = SCALE[si];
    if(si < 4){ m[a][b] = val; m[b][a] = 1/val; }
    else if(si > 4){ m[b][a] = val; m[a][b] = 1/val; }
    else { m[a][b] = 1; m[b][a] = 1; }
  });
  return m;
}

function computeWeights(m){
  const n = m.length;
  const colSums = new Array(n).fill(0);
  for(let j=0;j<n;j++) for(let i=0;i<n;i++) colSums[j]+=m[i][j];
  const norm = m.map(row=>row.map((v,j)=>v/colSums[j]));
  const weights = norm.map(row=> row.reduce((a,b)=>a+b,0)/n);
  return weights;
}

function computeConsistency(m, weights){
  const n = m.length;
  const Aw = m.map(row=> row.reduce((sum,v,j)=> sum + v*weights[j], 0));
  const ratios = Aw.map((v,i)=> v/weights[i]);
  const lambdaMax = ratios.reduce((a,b)=>a+b,0)/n;
  const CI = (lambdaMax - n)/(n-1);
  const RI = RI_TABLE[n] || 1.49;
  const CR = RI===0 ? 0 : CI/RI;
  return { lambdaMax, CI, CR };
}

function optionLocalWeights(si){
  const val = SCALE[si];
  let wA, wB;
  if(si < 4){ wA = val/(val+1); wB = 1/(val+1); }
  else if(si > 4){ wB = val/(val+1); wA = 1/(val+1); }
  else { wA = 0.5; wB = 0.5; }
  return { wA, wB };
}

function computeResults(){
  const m = buildCriteriaMatrix();
  const weights = computeWeights(m);
  const { CR } = computeConsistency(m, weights);
  const rows = CRITERIA.map((c, i)=>{
    const { wA, wB } = optionLocalWeights(state.optAnswers[i]);
    return { criteria:c, weight:weights[i], wA, wB };
  });
  const scoreA = rows.reduce((s,r)=> s + r.weight*r.wA, 0);
  const scoreB = rows.reduce((s,r)=> s + r.weight*r.wB, 0);
  return { rows, scoreA, scoreB, CR };
}

/* ---- STEP 1: CRITERIA PAIRWISE ---- */
function renderCriteria(){
  const idx = state.critIdx;
  const [a,b] = CRIT_PAIRS[idx];
  const left = CRITERIA[a], right = CRITERIA[b];
  const selected = state.critAnswers[idx];

  app.innerHTML = `
    ${topbar(1)}
    <div class="card">
      <div class="qmeta">Perbandingan Kriteria ${idx+1} dari ${CRIT_PAIRS.length}</div>
      <div class="qtitle">Menurut Anda, mana yang lebih penting dalam memilih opsi Gym Publik ISHAP?</div>

      <div class="versus">
        <div class="side left">
          <div class="num">Kriteria #${left.id}</div>
          <div class="label">${left.name}</div>
          <div class="desc">${left.desc}</div>
        </div>
        <div class="vs">VS</div>
        <div class="side right">
          <div class="num">Kriteria #${right.id}</div>
          <div class="label">${right.name}</div>
          <div class="desc">${right.desc}</div>
        </div>
      </div>

      <div class="scale">
        <div class="scale-track" id="scaleTrack">
          ${SCALE.map((v,i)=>`<button type="button" class="scale-btn ${i===4?'center':''} ${selected===i?'selected':''}" data-i="${i}">${scaleBtnLabel(i)}</button>`).join("")}
        </div>
        <div class="scale-hints"><span>&larr; ${left.name.split(" ").slice(0,3).join(" ")}…</span><span>…${right.name.split(" ").slice(0,3).join(" ")} &rarr;</span></div>
        <div class="scale-caption" id="scaleCaption">${selected!==null ? captionFor(selected,left,right) : "Pilih salah satu angka di atas"}</div>
      </div>

      <div class="btn-row">
        <button class="ghost" id="btnBack">Kembali</button>
        <button class="primary" id="btnNext" ${selected===null?"disabled":""}>Lanjut</button>
      </div>
    </div>
  `;

  function captionFor(si,left,right){
    const val = SCALE[si];
    const meaning = scaleMeaning(val);
    if(si===4) return "Sama penting";
    const winner = si<4 ? left.name : right.name;
    return `${meaning} — condong ke "${winner}"`;
  }

  document.querySelectorAll(".scale-btn").forEach(btn=>{
    btn.onclick = ()=>{
      const i = parseInt(btn.dataset.i,10);
      state.critAnswers[idx] = i;
      renderCriteria();
    };
  });

  document.getElementById("btnNext").onclick = ()=>{
    if(idx < CRIT_PAIRS.length-1){
      state.critIdx++;
      renderCriteria();
    }else{
      state.step = "options";
      render();
    }
  };
  document.getElementById("btnBack").onclick = ()=>{
    if(idx>0){ state.critIdx--; renderCriteria(); }
    else{ state.step="intro"; render(); }
  };
}

/* ---- STEP 2: OPTIONS PAIRWISE (per criterion) ---- */
function renderOptions(){
  const idx = state.optIdx;
  const crit = CRITERIA[idx];
  const selected = state.optAnswers[idx];

  app.innerHTML = `
    ${topbar(2)}
    <div class="card">
      <div class="qmeta">Perbandingan Opsi ${idx+1} dari ${CRITERIA.length}</div>
      <div class="qtitle">Untuk kriteria <b>#${crit.id} — ${crit.name}</b>, opsi mana yang lebih unggul?</div>
      <p class="lede" style="margin-bottom:18px;">${crit.desc}</p>

      <div class="versus">
        <div class="side left">
          <div class="num" style="color:var(--teal-dark)">OPSI A</div>
          <div class="label">${OPTION_A.label.replace("Opsi A — ","")}</div>
          <div class="desc">${OPTION_A.short}</div>
        </div>
        <div class="vs">VS</div>
        <div class="side right">
          <div class="num" style="color:var(--muted)">OPSI B</div>
          <div class="label">${OPTION_B.label.replace("Opsi B — ","")}</div>
          <div class="desc">${OPTION_B.short}</div>
        </div>
      </div>

      <div class="scale">
        <div class="scale-track" id="scaleTrack">
          ${SCALE.map((v,i)=>`<button type="button" class="scale-btn ${i===4?'center':''} ${selected===i?'selected':''}" data-i="${i}">${scaleBtnLabel(i)}</button>`).join("")}
        </div>
        <div class="scale-hints"><span>&larr; Opsi A unggul</span><span>Opsi B unggul &rarr;</span></div>
        <div class="scale-caption" id="scaleCaption">${selected!==null ? captionFor(selected) : "Pilih salah satu angka di atas"}</div>
      </div>

      <div class="btn-row">
        <button class="ghost" id="btnBack">Kembali</button>
        <button class="primary" id="btnNext" ${selected===null?"disabled":""}>${idx<CRITERIA.length-1?"Lanjut":"Lihat Hasil"}</button>
      </div>
    </div>
  `;

  function captionFor(si){
    const val = SCALE[si];
    const meaning = scaleMeaning(val);
    if(si===4) return "Kedua opsi setara untuk kriteria ini";
    const winner = si<4 ? "Opsi A" : "Opsi B";
    return `${meaning} — ${winner} lebih unggul`;
  }

  document.querySelectorAll(".scale-btn").forEach(btn=>{
    btn.onclick = ()=>{
      const i = parseInt(btn.dataset.i,10);
      state.optAnswers[idx] = i;
      renderOptions();
    };
  });

  document.getElementById("btnNext").onclick = ()=>{
    if(idx < CRITERIA.length-1){
      state.optIdx++;
      renderOptions();
    }else{
      state.step = "done";
      render();
    }
  };
  document.getElementById("btnBack").onclick = ()=>{
    if(idx>0){ state.optIdx--; renderOptions(); }
    else{ state.critIdx = CRIT_PAIRS.length-1; state.step="criteria"; render(); }
  };
}

      <table class="results">

        </thead>

          ${rows.map(r=>`

              <td>#${r.criteria.id} ${r.criteria.name}</td>

        <button class="link" id="btnRestart">Isi ulang dari awal</button>

  document.getElementById("btnDownloadJson").onclick = ()=> downloadJson(rows, scoreA, scoreB, CR);

/* ---------------------------------------------------------
   PER-COMPARISON LABELS — compact code like "3R" (nilai 3,
   condong ke item KANAN) or "5L" (nilai 5, condong ke item
   KIRI), "1" kalau sama penting. Ini yang muncul di kolom
   spreadsheet, dan langsung kebaca tanpa perlu buka JSON.
--------------------------------------------------------- */
function critAnswerLabel(pairIdx){
  const si = state.critAnswers[pairIdx];
  if(si===null || si===undefined) return "";
  const val = SCALE[si];
  if(si===4) return "1";
  return si<4 ? `${val}L` : `${val}R`;
}

function optAnswerLabel(critIdx){
  const si = state.optAnswers[critIdx];
  if(si===null || si===undefined) return "";
  const val = SCALE[si];
  if(si===4) return "1";
  return si<4 ? `${val}A` : `${val}B`;
}

/* ---------------------------------------------------------
   SHEET SUBMIT — POST to a Google Apps Script Web App via a
   hidden form (fetch() gets blocked by CORS on Apps Script,
   a real form POST targeting a hidden iframe does not)
--------------------------------------------------------- */
function submitToGoogleSheet(payload){
  return new Promise((resolve)=>{
    if(!CONFIG.sheetUrl){ resolve({skipped:true}); return; }
    try{
      let iframe = document.getElementById("sheetSubmitFrame");
      if(!iframe){
        iframe = document.createElement("iframe");
        iframe.id = "sheetSubmitFrame";
        iframe.name = "sheetSubmitFrame";
        iframe.style.display = "none";
        document.body.appendChild(iframe);
      }
      const form = document.createElement("form");
      form.action = CONFIG.sheetUrl;
      form.method = "POST";
      form.target = "sheetSubmitFrame";
      form.style.display = "none";

      const addField = (name,value)=>{
        const input = document.createElement("input");
        input.type = "hidden"; input.name = name; input.value = value;
        form.appendChild(input);
      };
      addField("nama", payload.responden.name || "");
      addField("peran", payload.responden.role || "");
      addField("tanggal", payload.tanggal);
      CRIT_PAIRS.forEach((_,i)=> addField(`c${i+1}`, critAnswerLabel(i)));
      CRITERIA.forEach((_,i)=> addField(`o${i+1}`, optAnswerLabel(i)));
      addField("skor_opsi_a", (payload.hasil.skor_opsi_a*100).toFixed(2));
      addField("skor_opsi_b", (payload.hasil.skor_opsi_b*100).toFixed(2));
      addField("consistency_ratio", payload.hasil.consistency_ratio.toFixed(4));
      addField("detail_json", JSON.stringify(payload));

      document.body.appendChild(form);
      form.submit();
      setTimeout(()=>{ if(form.parentNode) form.parentNode.removeChild(form); resolve({ok:true}); }, 700);
    }catch(e){
      resolve({ok:false, error:e});
    }
  });
}

/* ---------------------------------------------------------
   SUBMIT RESPONSE — send straight to the Google Sheet baked
   into this file. No dependency on Claude.ai's storage, so
   this works from any downloaded copy of the file too.
--------------------------------------------------------- */
async function saveResponseOnce(rows, scoreA, scoreB, CR){
  const statusEl = document.getElementById("saveStatus");
  if(state.saved){
    if(statusEl){ statusEl.innerHTML = "<b>Sudah terkirim ✓</b>"; }
    return;
  }
  const payload = buildFullPayload(rows, scoreA, scoreB, CR);

  if(!CONFIG.sheetUrl){
    state.saved = true;
    if(statusEl){
      statusEl.style.background = "rgba(224,82,82,0.10)";
      statusEl.style.border = "1px solid rgba(224,82,82,0.35)";
      statusEl.style.color = "var(--danger)";
      statusEl.innerHTML = "<b>Belum ada Spreadsheet terhubung.</b> Jawaban Anda TIDAK terkirim ke mana pun. Klik tombol unduh di bawah, lalu kirim file-nya secara manual ke penyelenggara kuisioner.";
    }
    return;
  }

  try{
    const result = await submitToGoogleSheet(payload);
    state.saved = true;
    if(statusEl){
      if(result.ok){
        statusEl.style.background = "rgba(255,255,255,0.06)";
        statusEl.style.border = "1px solid rgba(255,255,255,0.25)";
        statusEl.style.color = "var(--teal-dark)";
        statusEl.innerHTML = "<b>Terkirim ✓</b> — jawaban Anda sudah masuk sebagai baris baru di Google Spreadsheet.";
      }else{
        throw new Error("submit failed");
      }
    }
  }catch(err){
    console.error("Gagal mengirim ke spreadsheet:", err);
    state.saved = false;
    if(statusEl){
      statusEl.style.background = "rgba(224,82,82,0.10)";
      statusEl.style.border = "1px solid rgba(224,82,82,0.35)";
      statusEl.style.color = "var(--danger)";
      statusEl.innerHTML = "<b>Gagal mengirim otomatis</b> (mungkin koneksi internet bermasalah). Klik tombol unduh di bawah agar jawaban Anda tidak hilang, lalu kirim filenya ke penyelenggara.";
    }
  }
}

function buildFullPayload(rows, scoreA, scoreB, CR){
  const m = buildCriteriaMatrix();
  return {
    responden: state.profile,
    tanggal: new Date().toISOString(),
    matriks_kriteria: m,
    jawaban_kriteria: CRIT_PAIRS.map(([a,b],i)=>({
      kriteria_kiri: CRITERIA[a].name, kriteria_kanan: CRITERIA[b].name,
      nilai_terpilih: SCALE[state.critAnswers[i]], index: state.critAnswers[i]
    })),
    jawaban_opsi: CRITERIA.map((c,i)=>({
      kriteria: c.name, nilai_terpilih: SCALE[state.optAnswers[i]], index: state.optAnswers[i]
    })),
    hasil: {
      bobot_kriteria: rows.map(r=>({kriteria:r.criteria.name, bobot:r.weight})),
      skor_opsi_a: scoreA, skor_opsi_b: scoreB,
      consistency_ratio: CR
    }
  };
}

/* ---------------------------------------------------------
   EXPORT
--------------------------------------------------------- */
function triggerDownload(filename, content, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function downloadJson(rows, scoreA, scoreB, CR){
  const m = buildCriteriaMatrix();
  const payload = {
    responden: state.profile,
    tanggal: new Date().toISOString(),
    kriteria: CRITERIA,
    matriks_kriteria: m,
    jawaban_kriteria: CRIT_PAIRS.map(([a,b],i)=>({
      kriteria_kiri: CRITERIA[a].name, kriteria_kanan: CRITERIA[b].name,
      nilai_terpilih: SCALE[state.critAnswers[i]], index: state.critAnswers[i]
    })),
    jawaban_opsi: CRITERIA.map((c,i)=>({
      kriteria: c.name, nilai_terpilih: SCALE[state.optAnswers[i]], index: state.optAnswers[i]
    })),
    hasil: {
      bobot_kriteria: rows.map(r=>({kriteria:r.criteria.name, bobot:r.weight})),
      skor_opsi_a: scoreA, skor_opsi_b: scoreB,
      consistency_ratio: CR
    }
  };
  triggerDownload(`ahp_gym_${(state.profile.name||"responden").replace(/\s+/g,"_")}.json`, JSON.stringify(payload,null,2), "application/json");
}

function downloadCsv(rows, scoreA, scoreB, CR){
  let lines = ["Kriteria,Bobot,Opsi A,Opsi B"];
  rows.forEach(r=>{
    lines.push(`"#${r.criteria.id} ${r.criteria.name}",${(r.weight*100).toFixed(2)}%,${(r.wA*100).toFixed(1)}%,${(r.wB*100).toFixed(1)}%`);
  });
  lines.push("");
  lines.push(`Skor Akhir Opsi A,${(scoreA*100).toFixed(2)}%`);
  lines.push(`Skor Akhir Opsi B,${(scoreB*100).toFixed(2)}%`);
  lines.push(`Consistency Ratio,${CR.toFixed(4)}`);
  triggerDownload(`ahp_gym_ringkasan_${(state.profile.name||"responden").replace(/\s+/g,"_")}.csv`, lines.join("\n"), "text/csv");
}

render();
